# ═══════════════════════════════════════════════════════════════════════════════
# CI — PersePix bookstore (task 1-c, audit OPS-002; extended after audit v2)
#
# Gate → audit-finding map:
#   • typecheck ........ QUALITY-001 (build ignored type errors; a seeded type
#                        error must fail the pipeline, not ship)
#   • lint:ci .......... QUALITY-002 (audit v2: --max-warnings=0 — ANY seeded
#                        warning fails the pipeline; deliberate waivers are
#                        per-site eslint-disable comments with reasons)
#   • check:routes ..... audit v2 P1 route-coverage guard — the static gate for
#                        the REG-001 failure class (a deleted route whose UI
#                        call-sites remain); catches it in seconds pre-build
#   • prisma generate .. catches client/schema drift before build
#   • migrate deploy ... proves the migration chain applies cleanly to a fresh
#                        DB (audit 07-A "DB migration deploy: not a CI hook")
#   • build ............ OPS-002 — the Next.js standalone bundle must compile
#                        (next build + static/public copy into .next/standalone)
#   • smoke ............ QA-001 (audit v2) — black-box HTTP against the built
#                        server: healthz → register → login → add-to-cart →
#                        checkout (sandbox) → guest track → 403 matrix →
#                        admin login → admin upload (REG-001) → file served
#   • bun audit ........ DEP-001 — dependency CVE scan; BLOCKING since audit v2
#                        (audit advisories are pre-documented; a new CVE must
#                        stop the pipeline, not scroll past in the log)
#
# Single job by design: four jobs would re-checkout + re-install 4× for a
# ~2 min pipeline; the gates stay individually visible as named steps.
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Throwaway SQLite DB for the pipeline; `prisma migrate deploy` creates
      # the file from prisma/migrations — no service container needed.
      DATABASE_URL: file:/tmp/ci.db
      # Smoke run's admin credentials: seeded by prisma/seed.ts from these env
      # values (never hardcoded); the smoke script reuses them via SMOKE_*.
      SEED_ADMIN_PASSWORD: ci-smoke-admin-password-1
      SEED_CUSTOMER_PASSWORD: ci-smoke-customer-password-1
      SMOKE_ADMIN_EMAIL: owner@persepix.ir
      SMOKE_ADMIN_PASSWORD: ci-smoke-admin-password-1
      # Sandbox runtime needs the simulated gateway explicitly (SEC-014: it is
      # opt-in now; in dev the default is still SANDBOX, but be explicit in CI).
      PAYMENT_PROVIDER: sandbox
    steps:
      # ── setup ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # ── verify ───────────────────────────────────────────────────────────────
      - name: Prisma generate
        run: bunx prisma generate

      - name: Typecheck (QUALITY-001)
        run: bun run typecheck

      - name: Lint (QUALITY-002 — zero-warning gate)
        run: bun run lint:ci

      - name: Route-coverage guard (audit v2 — REG-001 class)
        run: bun run check:routes

      # ── build (OPS-002) ──────────────────────────────────────────────────────
      - name: Apply migrations to fresh CI DB
        run: bunx prisma migrate deploy

      - name: Build standalone bundle
        run: bun run build

      # ── smoke (QA-001) ───────────────────────────────────────────────────────
      - name: Seed smoke fixtures
        run: bun prisma/seed.ts

      - name: Start built server
        run: |
          bun run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/healthz >/dev/null && break
            sleep 1
          done
        shell: bash

      - name: Smoke test (register → cart → checkout → track → admin upload)
        run: bun run smoke

      # ── audit (DEP-001) ──────────────────────────────────────────────────────
      - name: Dependency audit (BLOCKING — DEP-001 closed)
        run: bun audit --production
        # Blocking since audit v2: known advisories are documented in the
        # security report; any NEW advisory must stop the pipeline. If a new
        # advisory is accepted as a risk, pin it with `bun audit --ignore` and
        # record the rationale in docs (never silent-pass).
